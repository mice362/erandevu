<div class="d-flex">
  <app-admin-sidebar></app-admin-sidebar>
  <div class="flex-grow-1 p-3">
    <div class="col-md-12">
      <app-token></app-token>
      <div class="card mt-5">
        <div class="card-header">
          <h2 class="h2">
            KLİNİK EKLE
          </h2>
        </div>
        <div class="card-body">
          <div class="container">
            <div class="row justify-content-center">
              <div class="col-md-11 mx-auto">
                <form class="row g-3" *ngIf="clinicForm" [formGroup]="clinicForm">

                  <div class="col-md-6">
                    <label for="inputName" class="form-label">Klinik Adı</label>
                    <div class="input-group">
                      <div class="input-group-text">🏥</div>
                      <input type="text" class="form-control" id="inputName" formControlName="Name" />
                    </div>
                  </div>

                  <div class="col-md-6">
                    <label for="inputPhone" class="form-label">Telefon</label>
                    <div class="input-group">
                      <div class="input-group-text">📞</div>
                      <input type="text" class="form-control" id="inputPhone" formControlName="Phone" />
                    </div>
                  </div>

                  <div class="col-md-6">
                    <label for="inputAddress" class="form-label">Adres</label>
                    <div class="input-group">
                      <div class="input-group-text">🏠</div>
                      <input type="text" class="form-control" id="inputAddress" formControlName="Address" />
                    </div>
                  </div>

                  <div class="col-md-6">
                    <label for="inputEmail" class="form-label">E-posta</label>
                    <div class="input-group">
                      <div class="input-group-text">📧</div>
                      <input type="email" class="form-control" id="inputEmail" formControlName="Email" />
                    </div>
                  </div>

                  <div class="col-md-12">
                    <label for="inputAbout" class="form-label">Hakkında</label>
                    <textarea class="form-control" id="inputAbout" rows="3" formControlName="About"></textarea>
                  </div>

                  <div class="col-12">
                    <button type="submit" class="btn btn-primary w-100" (click)="addClinics()">Klinik Ekle</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
