<div class="d-flex">
  <app-admin-sidebar></app-admin-sidebar>

  <div class="flex-grow-1 p-3">
    <div class="col-md-12">
      <app-token></app-token>
      <div class="card mt-5">
        <div class="card-header">
          <h2 class="text-center text-primary mb-4">KLİNİKLER</h2>
        </div>
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="d-flex align-items-center">
              <div class="input-group mr-3">
                <span class="input-group-text">
                  <i class="bi bi-search"></i>
                </span>
                <input type="text" [(ngModel)]="filterText" class="form-control" id="filterText" placeholder="Klinik adı" />
              </div>
            </div>
            <div>
              <button class="btn btn-success" [routerLink]="['/admin-add-clinic']">
                Klinik Ekle
              </button>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-striped">
              <thead class="thead-primary">
                <tr>
                  <th scope="col" style="width: 20%">Klinik Adı</th>
                  <th scope="col" style="width: 15%">Telefon Numarası</th>
                  <th scope="col" style="width: 25%">Mail Adresi</th>
                  <th scope="col" style="width: 25%">Adres</th>
                  <th scope="col" style="width: 15%">Hakkında</th>
                  <th scope="col" style="width: 10%">İşlemler</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let clinic of clinics | filterClinicName: filterText">
                  <td>{{ clinic.name | CapitalizeFirst }}</td>
                  <td>{{ clinic.phone }}</td>
                  <td>{{ clinic.email }}</td>
                  <td>{{ clinic.address }}</td>
                  <td>{{ clinic.about }}</td>
                  <td class="text-center">
                    <div class="btn-group" role="group">
                      <button class="btn btn-sm btn-primary" [routerLink]="['/admin-update-clinic', clinic.id]">
                        <i class="fa fa-pencil"></i>
                      </button>
                      <button class="btn btn-sm btn-danger" (click)="confirmDelete(clinic.id)">
                        <i class="fa fa-trash"></i>
                      </button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
            <app-pagination [totalPages]="totalPages" [pageIndex]="pageIndex" [pageSize]="pageSize"
              (pageChange)="onPageChanged($any($event))">
            </app-pagination>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
